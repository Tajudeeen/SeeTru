name: seetru
description: A personal crypto intelligence workspace.
publish_to: 'none'
version: 2.0.0+2
environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  dio: ^5.4.3+1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi_Complete/Fonts/OTF/Satoshi-Regular.otf
        - asset: assets/fonts/Satoshi_Complete/Fonts/OTF/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi_Complete/Fonts/OTF/Satoshi-Bold.otf
          weight: 700
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay_Complete/Fonts/OTF/ClashDisplay-Medium.otf
        - asset: assets/fonts/ClashDisplay_Complete/Fonts/OTF/ClashDisplay-Semibold.otf
          weight: 600
